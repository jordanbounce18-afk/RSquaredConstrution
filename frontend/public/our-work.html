<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Featured Project — R² Construction</title>
<style>
  :root {
    --cream: #FAF9F6;
    --card: #F2EFE9;
    --dark: #1C1C1C;
    --taupe: #9E907F;
    --border: #DCD7CE;
    --muted: #595959;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--dark);
    font-family: Arial, Helvetica, sans-serif;
  }
  header {
    padding: 48px 24px 0 24px;
    text-align: center;
  }
  .overline {
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 11px;
    color: var(--taupe);
  }
  h1 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 42px;
    margin: 12px 0 8px 0;
  }
  h1 em { font-style: italic; }
  .sub {
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 40px auto;
    line-height: 1.6;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 0 20px 80px 20px;
  }
  .video-frame {
    background: #000;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  video {
    display: block;
    width: 100%;
    height: auto;
  }
  .caption {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .cta {
    margin-top: 32px;
    text-align: center;
  }
  .cta a {
    display: inline-block;
    background: var(--dark);
    color: var(--cream);
    text-decoration: none;
    padding: 14px 32px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <div class="overline">R² Construction</div>
  <h1>Start to <em>finish.</em></h1>
  <p class="sub">A look at one of our recent projects, beginning to end.</p>
</header>

<div class="wrap">
  <div class="video-frame">
    <video controls preload="metadata" poster="/media/project-poster.jpg">
      <source src="/media/project-video.mp4" type="video/mp4" />
      Your browser doesn't support embedded video. <a href="/media/project-video.mp4">Download the video</a> instead.
    </video>
  </div>
  <p class="caption">Full renovation, captured from first day to final reveal.</p>
  <div class="cta">
    <a href="/#estimate">Request Your Free Estimate</a>
  </div>
</div>

</body>
</html>
